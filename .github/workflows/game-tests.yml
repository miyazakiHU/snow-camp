name: Game regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Test actual HTTP entry point, storage and controls
        run: python tests/test_game.py
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: game-test-results
          path: test-results/
          retention-days: 7
