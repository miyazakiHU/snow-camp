for(let f of flies){let a=clamp(f.t/f.dur,0,1),x=lerp(f.ax,f.bx,a),z=lerp(f.az,f.bz,a),y=lerp(f.ay,f.by,a)+Math.sin(a*Math.PI)*1.3;if(f.type==='cash')cashMesh(x,y,z,t*3,.55);else steak(x,y,z,f.type==='cooked',t*2,.55);}
for(let s of sparks)box(s.x,Math.max(.12,s.y),s.z,s.s,s.s,s.s,s.color,t*3,.25);
for(let g of Object.values(geom)){gl.bindBuffer(gl.ARRAY_BUFFER,g.db);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(g.dynamic),gl.DYNAMIC_DRAW);}
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,1024,1024);gl.clear(gl.DEPTH_BUFFER_BIT);drawPass(depthShader,lightVP);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.8,.9,.96,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);drawPass(shader,vp);drawOverlay();}
function inputStart(){if(!hasInput){hasInput=true;canvas.focus({preventScroll:true});sound('loot');}}
canvas.addEventListener('pointerdown',e=>{if(paused||mouse)return;e.preventDefault();inputStart();canvas.setPointerCapture(e.pointerId);mouse={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,drag:false,time:performance.now()};target=null;});
canvas.addEventListener('pointermove',e=>{if(!mouse||mouse.id!==e.pointerId)return;mouse.x=e.clientX;mouse.y=e.clientY;if(hypot(mouse.x-mouse.sx,mouse.y-mouse.sy)>7)mouse.drag=true;});
function pointerUp(e){if(!mouse||e.pointerId!==mouse.id)return;if(!mouse.drag&&e.type==='pointerup'){target=unproject(e.clientX,e.clientY);target.x=clamp(target.x,-6.6,state.lodge?14:6.6);target.z=clamp(target.z,-16.3,8);}mouse=null;}
canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',e=>{mouse=null;target=null;});canvas.addEventListener('lostpointercapture',()=>mouse=null);canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();if(!paused){keys[e.code]=true;inputStart();target=null;}}if(e.code==='Escape')toggleSettings(!paused);});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};mouse=null;target=null;});
function toggleSettings(on){paused=on;keys={};mouse=null;target=null;$('settings').classList.toggle('open',on);$('soundBtn').textContent='効果音：'+(state.sound?'ON':'OFF');if(on)save();}
$('menuBtn').onclick=()=>toggleSettings(true);$('closeBtn').onclick=()=>toggleSettings(false);$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent='効果音：'+(state.sound?'ON':'OFF');if(state.sound)sound('cash');save();};$('resetBtn').onclick=()=>{if(confirm('このゲームの進行を消して、はじめから遊びますか？')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
let last=performance.now();let frameCount=0,frameMS=0;
function loop(now){let elapsed=(now-last)/1000;last=now;let dt=clamp(elapsed,0,.25);if(!document.hidden){let n=Math.max(1,Math.ceil(dt/.025));for(let i=0;i<n;i++)update(dt/n);render();frameCount++;frameMS+=elapsed;}requestAnimationFrame(loop);}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();save();$('errorDetail').textContent='画面を再読み込みすると、保存した位置から再開できます。';$('error').style.display='block';});
render();requestAnimationFrame(loop);
})();
</script></body></html>
