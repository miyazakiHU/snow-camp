<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#438f9e;font-family:ui-rounded,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#world{touch-action:none;outline:none;cursor:grab}#world:active{cursor:grabbing}#overlay,#hud{pointer-events:none}#hud{position:absolute;inset:0;color:#193f48}#wallet{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:24px;background:#fff8e9f0;box-shadow:0 3px 0 #224e6338;font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}#coin{width:27px;height:27px;display:grid;place-items:center;background:#edb754;border:3px solid #fff0b4;color:#89561f;border-radius:50%;font-size:18px}#brand{position:absolute;top:max(21px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:900;letter-spacing:2px;color:#214c54;text-shadow:0 1px #fff9de}#islandName{display:block;font-size:10px;letter-spacing:1px;margin-top:3px}#menuBtn{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:#fff8e9ed;color:#24535a;border:0;font-size:21px;pointer-events:auto;cursor:pointer}#objective{position:absolute;top:max(78px,calc(env(safe-area-inset-top) + 65px));left:10px;right:10px;text-align:center;font-size:18px;font-weight:900;text-shadow:0 2px #fffbe9,1px 0 #fffbe9,-1px 0 #fffbe9}#missionHud{position:absolute;top:max(107px,calc(env(safe-area-inset-top) + 94px));left:50%;transform:translateX(-50%);background:#214b58d9;color:#fff9e6;border-radius:16px;padding:5px 13px;font-size:12px;white-space:nowrap}#hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:10px;right:10px;text-align:center;color:#fffdf1;font-size:15px;font-weight:900;text-shadow:0 2px 4px #214b58;transition:opacity .3s}#hint small{font-size:11px;display:block;margin-top:5px}#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 18px;text-align:center;border-radius:16px;color:#fff9e6;background:#225967f0;border:2px solid #f3e4bb;font-size:17px;font-weight:800;opacity:0;transition:opacity .2s}#toast.show{opacity:1}#saveWarn{position:absolute;bottom:4px;left:8px;right:8px;text-align:center;font-size:10px;background:#fff0cfda;color:#654226}#saveWarn:empty{display:none}#panel{position:absolute;inset:0;background:#163c4fb8;backdrop-filter:blur(5px);display:grid;place-items:center;z-index:6;padding:18px;overflow:auto}#panel[hidden],#error[hidden]{display:none}.sheet{background:#fff8e9;border:3px solid #e9dcb9;color:#234550;border-radius:25px;width:min(490px,100%);padding:26px;box-shadow:0 16px 80px #183c5455;max-height:calc(100dvh - 36px);overflow:auto}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#697d76}.sheet h1,.sheet h2{font-size:25px;letter-spacing:1px;margin:9px 0 12px}.sheet p{font-size:14px;line-height:1.8}.sheet .muted{font-size:12px;color:#647875}.sheet button{font:inherit;font-size:14px;font-weight:800;cursor:pointer;border:2px solid #d9d5be;border-radius:14px;background:#fffdf7;color:#284e54;padding:12px 14px;min-height:44px}.sheet button:disabled{opacity:.4;cursor:default}.sheet button:focus-visible{outline:3px solid #176876;outline-offset:2px}.primary{background:#267b7c!important;border-color:#267b7c!important;color:#fffbe9!important}.wide{display:block;width:100%;margin-top:10px}.danger{color:#a4533f!important;font-size:12px!important}.routes{display:flex;gap:8px;margin:17px 0}.routes button{flex:1;padding:13px 5px;font-size:12px;line-height:1.6}.routes b{display:block;font-size:23px}.selected{border-color:#287d7c!important;background:#e0eee2!important}.gear{display:grid;gap:7px;margin:12px 0}.gear button{text-align:left;display:flex;align-items:center;gap:12px}.gear button strong{min-width:90px}.gear button span{font-weight:500;font-size:12px;line-height:1.5}.divider{border:0;border-top:1px solid #d6d7c0;margin:16px 0}.souvenir{font-size:40px;letter-spacing:7px;margin:15px 0}.dangerBox{background:#f8e6d5;padding:10px;border-radius:10px}#error{position:absolute;inset:0;background:#fff8e9;z-index:10;display:grid;place-content:center;padding:28px;text-align:center;color:#234550;line-height:1.8}@media(max-width:560px){#brand{font-size:12px;letter-spacing:1px}#wallet{font-size:20px;padding-right:11px}#objective{font-size:16px}#missionHud{font-size:11px}#hint small{display:none}.sheet{padding:21px}.sheet h2{font-size:23px}}
